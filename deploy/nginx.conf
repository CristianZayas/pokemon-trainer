server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://raw.githubusercontent.com; connect-src 'self' https://pokeapi.co" always;

    location = /healthz { access_log off; return 200 "ok"; }
    location / { try_files $uri $uri/ /index.html; }
    location ^~ /vendor/ { try_files $uri =404; expires 1h; }
    location ~* ^/(?:main|chunk|styles)-[^/]+\.(?:js|css)$ { try_files $uri =404; expires 1y; }
    location = /favicon.ico { try_files $uri =404; expires 1d; }
}
